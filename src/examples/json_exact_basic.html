<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/style.css">
    <script
            async
            src="{TD_URL}/js/website-integration.js"
            referrerpolicy="origin"
            data-td-api="{TD_URL}/api"
            data-td-api-key="{TD_API_KEY}"
    ></script>
    <script>
        const td_open = () => {
            console.log("Opening Tron Designer...");
            window.tronDesigner.openDesigner({
                "openMode": "Create",
                "dataMode": "Exact",
                "printJob": {
                    "addPrintings": [
                        {
                            "printPositionCode": "front",
                            "printTechnologyCode": "PAD03"
                        }
                    ],
                    "addProducts": {
                        "supplierCode": "PFC",
                        "variants": [
                            {
                                "productCode": "10086021"
                            }
                        ]
                    }
                }
            }, { mode: "dialog" });
        }
    </script>
    <title>Tron Designer Integration - JSON Exact Example</title>
</head>
<body>
<div class="header">
    <div><a href="https://www.trondesigner.com"><img src="https://cdn-webassets.promotron.com/images/td/logo-full-light-theme.svg" class="logo"></a></div>
    <h1>
        <span>TronDesigner</span> - Integration Examples<br>
        <small>Docs:
            <a href="https://app.trondesigner.com/docs/" target="_blank">Developer documentation</a> &nbsp;|&nbsp;
            <a href="https://app.trondesigner.com/docs/documents/Editor-arguments.html" target="_blank">Editor arguments</a> &nbsp;|&nbsp;
            <a href="https://app.trondesigner.com/docs/documents/Data-modes.html" target="_blank">Data modes</a>
        </small>
    </h1>
    <a href="index.html">Back to examples</a>
</div>
<div class="example">
    <img src="https://troncloudprod.blob.core.windows.net/mockup-preview-images/5d1a2633-1ada-4de0-a565-c22b0a2af3f0" alt="Oregon 400 ml - Red"/>
    <div class="actions">
        <h4>JSON - Exact</h4>
        <button class="btn" onclick="td_open()">
            Open Designer
            <br>
            <small>Oregon 400 ml - Red</small>
        </button>
    </div>
</div>
</body>
</html>
