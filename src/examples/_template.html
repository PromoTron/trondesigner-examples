<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/style.css">
    <script
            async
            src="{TD_URL}/js/website-integration.js"
            referrerpolicy="origin"
            data-td-api="{TD_URL}/api"
            data-td-api-key="{TD_API_KEY}"
    ></script>
    <title>Tron Designer Integration - Template</title>
</head>
<body>
<div class="header">
    <div><a href="https://www.trondesigner.com"><img src="https://cdn-webassets.promotron.com/images/td/logo-full-light-theme.svg" class="logo"></a></div>
    <h1>
        <span>TronDesigner</span> - Integration Examples<br>
        <small>Docs:
            <a href="https://app.trondesigner.com/docs/" target="_blank">Developer documentation</a> &nbsp;|&nbsp;
            <a href="https://app.trondesigner.com/docs/documents/Quick-start.html" target="_blank">Quick start</a>
        </small>
    </h1>
    <a href="index.html">Back to examples</a>
</div>
<div class="example">
    <img src="https://troncloudprod.blob.core.windows.net/mockup-preview-images/5d1a2633-1ada-4de0-a565-c22b0a2af3f0" alt="Oregon 400 ml - Red"/>
    <div class="actions">
        <button class="btn"
                data-td-action="OpenCreate"
                data-td-supplier-code="PFC"
                data-td-product-code="10086021"
                data-td-print-position-code="front"
                data-td-print-technology-code="PAD03">
            Open Designer
            <br>
            <small>Oregon 400 ml - Red</small>
        </button>
    </div>
</div>

<div style="margin: 30px 10px; padding: 20px; background: #f9f9f9; border-radius: 8px;">
    <h3>Implementation Code</h3>
    <pre style="background: #fff; padding: 15px; border-radius: 4px; overflow-x: auto; font-size: 12px;"><code>&lt;!-- show the code the page runs, escaped --&gt;</code></pre>
</div>
</body>
</html>
